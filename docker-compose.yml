services:

  neo4j:
    image: neo4j:5-community
    container_name: benchmark-neo4j

    environment:
      NEO4J_AUTH: neo4j/benchmarkpassword
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m

    ports:
      - "7474:7474"
      - "7687:7687"

    mem_limit: 1g
    cpus: 0.5

    volumes:
      - neo4j_data:/data

  memgraph:
    image: memgraph/memgraph:latest
    container_name: benchmark-memgraph

    ports:
      - "7688:7687"

    mem_limit: 256m
    cpus: 0.5

    volumes:
      - memgraph_data:/var/lib/memgraph

  falkordb:
    image: falkordb/falkordb:latest
    container_name: benchmark-falkordb

    ports:
      - "6379:6379"

    mem_limit: 256m
    cpus: 0.5

    volumes:
      - falkordb_data:/data

volumes:
  neo4j_data:
  memgraph_data:
  falkordb_data: